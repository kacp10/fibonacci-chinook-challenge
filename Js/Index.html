<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Fibonacci</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
    <h1 class="text-2xl font-bold text-center">Calculadora Fibonacci</h1>

    <input id="numberInput" type="number" min="0"
           class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring"
           placeholder="Ingresa un número (0‑30)" />

    <button id="calcBtn"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
      Calcular Fibonacci
    </button>

    <p id="output" class="text-center text-xl font-semibold text-green-700"></p>
  </div>

  <script type="module">
    import { fibList } from './fib.js';

    const input = document.getElementById('numberInput');
    const btn   = document.getElementById('calcBtn');
    const out   = document.getElementById('output');

    btn.addEventListener('click', () => {
      const n = Number(input.value);

      if (!Number.isInteger(n) || n < 0) {
        out.textContent = '⚠️ Ingresa un entero ≥ 0';
        out.classList.replace('text-green-700', 'text-red-600');
        return;
      }
      if (n > 30) {
        out.textContent = '⚠️ Solo se permite 0‑30 según la prueba';
        out.classList.replace('text-green-700', 'text-red-600');
        return;
      }

      const result = fibList([n])[0];
      out.textContent = `Fib(${n}) = ${result}`;
      out.classList.replace('text-red-600', 'text-green-700');
    });
  </script>
</body>
</html>
